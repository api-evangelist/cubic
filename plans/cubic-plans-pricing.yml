description: Cubic delivers transit (Cubic Transportation Systems / fare collection / ITS) and defense
  (Cubic Defense / training / mission systems) under government and commercial contracts. There is no
  public commercial API price list; APIs ship inside delivered systems and pricing rolls into the underlying
  contract.
sources:
  - https://www.cubic.com/
notes: Cubic is project / contract-priced; no public API plans exist. Reconcile against the relevant
  government or transit-agency contract.
