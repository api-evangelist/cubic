description: >-
  Cubic publishes no API price list, because it does not sell APIs as a product. It sells
  transit and defense systems under agency and government contracts, and the integration
  surfaces ship inside those systems. The one exception, and it is a real published term rather
  than an inference, is the Umo IQ Public Feed: its licence agreement states in terms that the
  feed is "free-of-charge to Umo IQ' respective CUSTOMERS", requires no account and no key, and
  reserves Cubic's right to terminate or limit access at any time.
sources:
  - https://retro.umoiq.com/xmlFeedDocs/NextBusXMLFeed.pdf
  - https://www.cubic.com/
notes: >-
  No self-serve signup, no pricing page, no metered tier exists anywhere on Cubic's or Umo's
  public surface. Everything other than the public feed is negotiated per contract.
plan_count: 2
plans:
  - id: umo-iq-public-feed
    name: Umo IQ Public Feed
    type: free
    description: >-
      Anonymous, unauthenticated, read-only access to the transit feed. No account, no key, no
      billing relationship. Access is bounded by published volume limits rather than by a plan.
    price: 0
    currency: USD
    billing_period: none
    onboarding: none
    limits_ref: rate-limits/cubic-rate-limits.yml
    terms: >-
      Licensed free of charge to Umo IQ customer agencies. No support outside written contracts.
      Cubic reserves the right to terminate or limit the feed to any or all users at any time and
      for any reason.
    source: https://retro.umoiq.com/xmlFeedDocs/NextBusXMLFeed.pdf
    elements:
      - name: Umo IQ Public Feed API
  - id: cubic-contract
    name: Contract / Project
    type: enterprise
    description: >-
      Every other Cubic surface — the Umo agency platform, GRIDSMART, Trafficware, and defense
      systems — is delivered under a transit-agency or government contract, with API access and
      integration scoped by that contract.
    price: contact sales
    currency: USD
    billing_period: contract
    onboarding: sales
    entries:
      - label: Contracted system
        description: Negotiated system / project pricing
        name: contract
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        domains:
          - https://www.cubic.com
        unit: 1
        price: contact sales
        userMultiplied: false
