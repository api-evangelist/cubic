  - FOCUS
description: 'FOCUS-aligned FinOps for Cubic: contract-priced transit and defense systems with embedded
  APIs; spend is tracked as project / milestone delivery rather than per-call usage.'
sources:
  - https://www.cubic.com/
notes: No public pricing. Treat Cubic spend as project-based; reconcile against the contract milestone
  schedule.
principles:
  - name: Visibility
    description: Track Cubic spend through contract milestones and delivered-system commissioning rather
      than API-call telemetry.
  - name: Allocation
    description: Allocate to the transit agency / mission program owning the contract; tag delivered
      stations / endpoints by route / theater.
  - name: Optimization
    description: Negotiate scope at contract milestones; consolidate vendor systems across modes / theaters
      to reduce duplicate licensing.
  - name: Accountability
    description: Program management and finance jointly own the Cubic contract; review milestone burn-down
      and change-orders quarterly.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Allocation
      - Reporting and Analytics
  - name: Quantify Business Value
    capabilities:
      - Forecasting
      - Budgeting
  - name: Optimize Usage and Cost
    capabilities:
      - Workload Optimization
  - name: Manage the FinOps Practice
    capabilities:
      - Invoicing and Chargeback
billingModel:
  pricingCategory: Contract / Milestone
  billingFrequency: Per-Invoice
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Tax
    - Adjustment
  chargeFrequency: Milestone
focusColumns:
  ServiceName: Cubic Corporation
