domain_standards_note: >-
  REWARD-ONLY — the transit-data market does have standards and this contract declares none of
  them. Recorded as a measured absence, with the probe that establishes it, not as a penalty.
domain_standards:
  - id: gtfs
    name: General Transit Feed Specification (static)
    conforms: false
    evidence: >-
      No GTFS surface is served by this API. The feed's own documentation warns the opposite
      way — that its stop tags "might not always correspond to GTFS or other configuration data"
      because of the _IB/_OB duplication scheme — which is an explicit statement of GTFS
      divergence rather than conformance.
  - id: gtfs-realtime
    name: GTFS Realtime (protobuf)
    conforms: false
    evidence: >-
      The feed carries exactly the three GTFS-Realtime entity classes (trip updates as
      predictions, vehicle positions as vehicleLocations, service alerts as messages) in a
      proprietary XML/JSON encoding instead of the GTFS-RT protobuf. No .proto, no protobuf
      media type, no GTFS-RT endpoint found on any host on 2026-09-19. Third-party bridges exist
      (npm nextbus-to-gtfs-rt) precisely because the provider ships none.
  - id: siri
    name: CEN SIRI (Service Interface for Real-time Information)
    conforms: false
    evidence: No SIRI service, no SIRI XML namespace, no SIRI request shapes in the contract or documentation.
  - id: transmodel
    name: EN 12896 Transmodel / NeTEx
    conforms: false
    evidence: The data model is proprietary (agency/route/stop/direction tags); no Transmodel or NeTEx vocabulary appears.
  - id: ogc-api
    name: OGC API
    conforms: false
    evidence: >-
      Probed for an OGC surface because the feed serves geospatial data (stop and vehicle
      lat/lon, route polylines). No /conformance, no /collections, no GetCapabilities on
      retro.umoiq.com. Coordinates are bare lat/lon string attributes, not GeoJSON.
