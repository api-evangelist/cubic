description: >-
  Cross-cutting and domain standards asserted, or honestly denied, for the Umo IQ Public Feed.
  This is a pre-standards surface: it predates the transit-data standards its own market now
  runs on, and it implements none of them. Each entry below is evidenced by the contract or by a
  live probe, not by a marketing claim.
