# Negative probe result — recorded deliberately.
#
# roadmap#27: `llms_txt_published` credited a DECLARED pointer wherever no llms/
# artifact existed. This file IS that artifact — a record of where we looked and what
# came back. The llms.txt sitting beside it (cubic-llms.txt) is OURS, generated by this
# pipeline and marked as such in its own first paragraph, so it does not and must not
# read as a document Cubic published.
#
# A recorded absence is a valid measurement. Do not delete this to 'clean up'.
llms:
  probed: '2026-09-19'
  published: false
  verdict: no-provider-llms-txt
  probes:
    - url: https://developer.cubic.com/llms.txt
      http_status: 301
      redirect: http://www.cubic.com/coming-soon
      note: >-
        Changed since the 2026-08-17 probe, which recorded a 200 serving 212 bytes of HTML.
        developer.cubic.com now redirects every path to a coming-soon page and sits behind an
        Imperva bot challenge. There is no Cubic developer portal.
    - url: https://www.cubic.com/llms.txt
      http_status: 404
      content_type: text/html
      note: Honest 404 from the origin.
    - url: https://umoiq.com/llms.txt
      http_status: 200
      content_type: text/html
      note: Angular single-page-app shell returned for any path — a 200 is not evidence.
    - url: https://www.umoiq.com/llms.txt
      http_status: 200
      content_type: text/html
      note: Same SPA catch-all.
    - url: https://retro.umoiq.com/llms.txt
      http_status: 200
      content_type: text/html;charset=ISO-8859-1
      note: The feed host's own HTML 404 page, served with a 200.
    - url: https://umomobility.com/llms.txt
      http_status: 404
      content_type: text/html
    - url: https://api.umoiq.com/llms.txt
      http_status: 404
      content_type: application/json
      note: '{"success":false,"error":"Not Found"} — the only host that answers honestly.'
