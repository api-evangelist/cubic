description: >-
  Cubic Corporation is a San Diego defense and public-transportation technology company
  (Cubic Transportation Systems and Cubic Defense) that delivers fare-collection, traffic
  management and mission systems under agency and government contracts. Its one publicly
  documented API is the Umo IQ Public Feed (the former NextBus feed) served by Cubic
  Transportation Systems at retro.umoiq.com: an anonymous XML/JSON query-command feed of
  transit agencies, routes, stops, arrival predictions, schedules, service messages and live
  vehicle locations for the agencies Cubic serves. Cubic's other integration surfaces
  (GRIDSMART, Trafficware, the Umo agency portal API) sit behind customer logins.
