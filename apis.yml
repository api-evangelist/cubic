    description: >-
      The Umo IQ Public Feed (formerly the NextBus Public XML Feed, revision 1.24, 18 May 2021)
      is Cubic Transportation Systems' anonymous, unauthenticated real-time transit feed. A
      single GET endpoint in XML (/publicXMLFeed) or JSON (/publicJSONFeed) form is driven by a
      command query parameter: agencyList, routeList, routeConfig, predictions,
      predictionsForMultiStops, schedule, messages, vehicleLocations and vehicleLocation. It is
      licensed free of charge to Umo IQ customer agencies and carries published per-IP data
      limits (2 MB per 20 seconds) and a 10-second polling floor.
    x-evidence:
      verified: '2026-09-19'
      method: probed
      docs: https://retro.umoiq.com/xmlFeedDocs/NextBusXMLFeed.pdf
      docs_status: 200
      docs_content_type: application/pdf
      ownership: >-
        retro.umoiq.com's own footer reads "Cubic Transportation Systems, Inc. Proprietary
        Information", the feed documentation routes support to umoiq.support@cubic.com, and
        www.cubic.com markets the Umo Mobility Platform as a Cubic Transportation Systems product.
      commands_probed:
        - command: agencyList
          status: 200
          note: 17 agencies listed (jhu-apl, ccrta, west-hollywood, da, dumbarton-gtfs, escalon, glendale, indianapolis-air, omnitrans, pvpta, portland-sc, roosevelt, stl, ttc, unitrans, ucb, wku)
        - command: routeList
          status: 200
        - command: routeConfig
          status: 200
        - command: predictions
          status: 200
        - command: predictionsForMultiStops
          status: 200
        - command: schedule
          status: 200
        - command: messages
          status: 200
        - command: vehicleLocations
          status: 200
        - command: vehicleLocation
          status: 200
      note: >-
        Every documented command answered on both the XML and JSON feeds against agency ttc on
        2026-09-19. The documentation's example agency sf-muni is no longer served ("Agency
        parameter a=sf-muni is not valid"). The feed returns HTTP 200 for every request, including
        errors, and signals failure in an Error element with a shouldRetry attribute.
