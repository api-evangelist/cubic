description: >-
  Authentication posture for the one Cubic API with public documentation. The Umo IQ Public
  Feed requires no credential of any kind — no key, no token, no header, no signed request.
  Access control is contractual rather than technical: the feed's licence grants use to Umo IQ
  customer agencies and reserves the right to terminate or limit access, but the endpoint itself
  is open to anonymous callers and enforces only per-IP volume limits.
